<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HL Light - Privacy Policy</title>
  <script>
    (function() {
      var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      var target = 'en.html';
      if (lang.indexOf('zh-tw') !== -1 || lang.indexOf('zh-hk') !== -1 || lang.indexOf('zh-hant') !== -1) {
        target = 'zh-Hant.html';
      } else if (lang.indexOf('zh') !== -1) {
        target = 'zh-Hans.html';
      } else if (lang.indexOf('de') !== -1) {
        target = 'de.html';
      } else if (lang.indexOf('fr') !== -1) {
        target = 'fr.html';
      } else if (lang.indexOf('es') !== -1) {
        target = 'es.html';
      } else if (lang.indexOf('it') !== -1) {
        target = 'it.html';
      } else if (lang.indexOf('ru') !== -1) {
        target = 'ru.html';
      } else if (lang.indexOf('ja') !== -1) {
        target = 'ja.html';
      }
      window.location.replace(target);
    })();
  </script>
  <style>
:root {
  --bg-color: #f7f9fa;
  --card-bg: #ffffff;
  --text-primary: #1d1d1f;
  --text-secondary: #515154;
  --border-color: #e5e5ea;
  --link-color: #0071e3;
  --accent-color: #0071e3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-color: #0f1115;
    --card-bg: #1c1e24;
    --text-primary: #f5f5f7;
    --text-secondary: #a1a1a6;
    --border-color: #2c2f36;
    --link-color: #2997ff;
    --accent-color: #2997ff;
  }
}
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-primary);
  line-height: 1.6;
  margin: 0;
  padding: 24px 16px;
}
.container {
  max-width: 820px;
  margin: 0 auto;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 40px 32px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
}
@media (max-width: 600px) {
  .container { padding: 24px 18px; }
}
.lang-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding-bottom: 24px;
  margin-bottom: 32px;
  border-bottom: 1px solid var(--border-color);
}
.lang-btn {
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 20px;
  text-decoration: none;
  background: var(--bg-color);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  transition: all 0.2s ease;
}
.lang-btn:hover {
  color: var(--link-color);
  border-color: var(--link-color);
}
.lang-btn.active {
  background: var(--accent-color);
  color: #fff;
  border-color: var(--accent-color);
  font-weight: 600;
}
h1 { font-size: 26px; margin-top: 0; color: var(--text-primary); }
h2 { font-size: 19px; margin-top: 32px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
h3 { font-size: 16px; margin-top: 20px; }
p, li { font-size: 15px; color: var(--text-secondary); }
strong { color: var(--text-primary); }
ul { padding-left: 20px; margin: 10px 0; }
li { margin-bottom: 6px; }
hr { border: 0; height: 1px; background: var(--border-color); margin: 28px 0; }
a { color: var(--link-color); text-decoration: none; word-break: break-all; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="container">
    <h2>Select Language / 选择语言</h2>
    <nav class="lang-bar"><a href="zh-Hans.html" class="lang-btn">简体中文</a>
<a href="zh-Hant.html" class="lang-btn">繁體中文</a>
<a href="en.html" class="lang-btn">English</a>
<a href="de.html" class="lang-btn">Deutsch</a>
<a href="fr.html" class="lang-btn">Français</a>
<a href="es.html" class="lang-btn">Español</a>
<a href="it.html" class="lang-btn">Italiano</a>
<a href="ru.html" class="lang-btn">Русский</a>
<a href="ja.html" class="lang-btn">日本語</a></nav>
  </div>
</body>
</html>
